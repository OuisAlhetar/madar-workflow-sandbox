name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        run: php --version

      - name: Syntax
        run: |
          find src tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: DB-free gate (no driver, no DSN, no credentials in the code)
        run: |
          set -eu
          if grep -rInE '\b(PDO|mysqli|pg_connect|DB_HOST|DB_PASSWORD|DB_USER|DSN)\b' src tests scripts; then
            echo "::error::database access is not allowed in this repository"
            exit 1
          fi
          echo "no database access found"

      - name: Gate self-check
        run: bash scripts/gate-selfcheck.sh

      # `--self-test` breaks a copy of the gate on purpose: it exits 0 when the damage is detected and
      # non-zero when the checker stays green on a broken gate. So the step simply has to succeed.
      - name: Self-check negative control
        run: bash scripts/gate-selfcheck.sh --self-test

      - name: Tests
        run: php tests/run.php

      - name: Runner sanity (a subset must pass even while a seeded test is red)
        run: php tests/run.php test_single_line
